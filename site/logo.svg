<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">gradual-json：碎块逐渐组成大括号</title>
  <style>
    .piece {
      transform-box: fill-box;
      transform-origin: center;
      animation: assemble 1.2s cubic-bezier(.22, 1, .36, 1) both;
      animation-delay: var(--delay);
    }
    @keyframes assemble {
      from {
        opacity: .25;
        transform: translate(var(--x), var(--y)) rotate(var(--angle));
      }
      to {
        opacity: 1;
        transform: translate(0, 0) rotate(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .piece { animation: none; }
    }
  </style>
  <g fill="#2f643d">
    <path class="piece" style="--x:5px;--y:7px;--angle:-20deg;--delay:0s" d="M26 6h-4c-8 0-12 4-12 12h6c0-4 2-6 6-6h4Z"/>
    <path class="piece" style="--x:-3px;--y:5px;--angle:35deg;--delay:.12s" d="M10 18h6v5h-6Z"/>
    <path class="piece" style="--x:7px;--y:-4px;--angle:-25deg;--delay:.24s" d="M10 23c0 4-2 6-6 6v3h8c2-2 4-5 4-9Z"/>
    <path class="piece" style="--x:5px;--y:4px;--angle:25deg;--delay:.36s" d="M4 32h8c2 2 4 5 4 9h-6c0-4-2-6-6-6Z"/>
    <path class="piece" style="--x:-3px;--y:-5px;--angle:-35deg;--delay:.48s" d="M10 41h6v5h-6Z"/>
    <path class="piece" style="--x:6px;--y:-7px;--angle:20deg;--delay:.6s" d="M10 46c0 8 4 12 12 12h4v-6h-4c-4 0-6-2-6-6Z"/>
    <g transform="translate(64 0) scale(-1 1)">
      <path class="piece" style="--x:6px;--y:7px;--angle:20deg;--delay:.08s" d="M26 6h-4c-8 0-12 4-12 12h6c0-4 2-6 6-6h4Z"/>
      <path class="piece" style="--x:-3px;--y:5px;--angle:-35deg;--delay:.2s" d="M10 18h6v5h-6Z"/>
      <path class="piece" style="--x:5px;--y:-4px;--angle:25deg;--delay:.32s" d="M10 23c0 4-2 6-6 6v3h8c2-2 4-5 4-9Z"/>
      <path class="piece" style="--x:7px;--y:4px;--angle:-25deg;--delay:.44s" d="M4 32h8c2 2 4 5 4 9h-6c0-4-2-6-6-6Z"/>
      <path class="piece" style="--x:-3px;--y:-5px;--angle:35deg;--delay:.56s" d="M10 41h6v5h-6Z"/>
      <path class="piece" style="--x:5px;--y:-7px;--angle:-20deg;--delay:.68s" d="M10 46c0 8 4 12 12 12h4v-6h-4c-4 0-6-2-6-6Z"/>
    </g>
  </g>
</svg>
